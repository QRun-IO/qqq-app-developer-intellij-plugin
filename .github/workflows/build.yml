name: IntelliJ plugin
'on':
  push:
    branches:
    - main
    - develop
    tags:
    - v*
  pull_request:
    branches:
    - main
    - develop
  workflow_dispatch:
    inputs:
      publish:
        description: Sign and publish the selected vVERSION tag after approval
        type: boolean
        default: false
      version:
        description: Exact source version for signed Marketplace publication
        type: string
        default: ''
permissions:
  contents: read
jobs:
  plugin:
    uses: QRun-IO/qqq-orb/.github/workflows/intellij-plugin.yml@0f33ddadf88b9a1b940b8883782fe2000ee1d2bd
    with:
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
      version: ${{ inputs.version || '' }}
    secrets: inherit
